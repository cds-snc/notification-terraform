name: "Secret scanning"

on:
  workflow_call:

permissions:
  contents: read

env:
  # Temporary CA mitigation; remove with prepare-ubuntu-ca.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  trufflehog:
    name: "TruffleHog"
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: v3.99.7
          extra_args: --no-verification --fail-on-scan-errors
